name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build and handle error
        run: |
          npm run build || {
            echo "--- BUILD FAILED ---" > build_error.log
            npx tsc -b >> build_error.log 2>&1 || true
            npx vite build >> build_error.log 2>&1 || true
            git config --global user.name "GitHub Action"
            git config --global user.email "actions@github.com"
            git add build_error.log
            git commit -m "Commit build failure log [skip ci]"
            git push origin main
            exit 1
          }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
